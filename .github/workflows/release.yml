name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: duskt-linux-x86_64
            executable: duskt
            data_separator: ":"
          - os: windows-latest
            asset: duskt-windows-x86_64.exe
            executable: duskt.exe
            data_separator: ";"
          - os: macos-14
            asset: duskt-macos-x86_64
            executable: duskt
            data_separator: ":"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[build]"

      - name: Build executable
        shell: bash
        run: >
          python -m PyInstaller --clean --noconfirm --onefile
          --name duskt
          --paths src
          --add-data "src/duskt/app.tcss${{ matrix.data_separator }}duskt"
          src/duskt/__main__.py

      - name: Rename release asset
        shell: bash
        run: mv "dist/${{ matrix.executable }}" "dist/${{ matrix.asset }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
