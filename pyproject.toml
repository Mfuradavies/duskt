[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "duskt"
version = "0.1.0"
description = "A minimal terminal video downloader"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pyperclip>=1.8.2",
  "textual>=0.47.0",
  "yt-dlp>=2024.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
build = ["pyinstaller>=6.0"]

[project.scripts]
duskt = "duskt.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/duskt"]
